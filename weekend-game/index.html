<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>My Weekend World</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#80bd76;font-family:Arial}canvas{display:block;width:100vw;height:100dvh;touch-action:none}#top{position:fixed;top:12px;left:12px;background:#102e38e8;color:white;border-radius:14px;padding:12px;font-weight:bold}#pad{position:fixed;bottom:25px;left:22px;width:120px;height:120px;border-radius:50%;background:#ffffff66;border:3px solid white;touch-action:none}#nub{position:absolute;left:37px;top:37px;width:40px;height:40px;border-radius:50%;background:#fff}#talk{position:fixed;bottom:43px;right:25px;border:0;background:#ffcf60;color:#35280b;border-radius:50%;width:90px;height:90px;font-weight:bold}#box{display:none;position:fixed;inset:0;background:#0009;align-items:center;justify-content:center;padding:15px}#card{background:white;color:#172e35;border-radius:20px;padding:24px;width:min(420px,100%)}input{width:100%;padding:14px;border:2px solid #8db6ad;border-radius:9px;font-size:16px}#card button{margin-top:15px;padding:12px 20px;border:0;border-radius:9px;background:#187c72;color:white}#hint{position:fixed;bottom:7px;left:45%;font-size:12px;color:#123b3b;background:#ffffffa8;padding:4px;border-radius:6px}@media(min-width:800px){#pad,#talk{opacity:.7}}</style><canvas id="c"></canvas><div id="top">🌎 My Weekend World<br><small id="count">0 / 5 activities</small></div><div id="pad"><div id="nub"></div></div><button id="talk">TALK</button><div id="hint">WASD / arrows · E to talk</div><div id="box"><div id="card"><h2 id="place"></h2><p id="question"></p><input id="ans" placeholder="Write your own English sentence"><div><button id="back">Back</button> <button id="save">Save</button></div></div></div><script>(()=>{const c=document.querySelector('#c'),g=c.getContext('2d');let w,h,d=1;function size(){w=innerWidth;h=innerHeight;d=Math.min(devicePixelRatio||1,2);c.width=w*d;c.height=h*d;g.setTransform(d,0,0,d,0,0)}onresize=size;size();let x=900,y=700,dx=0,dy=0,near=null,chosen=null;const keys={};const spots=[['🏠','Home',340,350,'What do you want to do at home?'],['🌳','Park',1460,330,'What do you want to do in the park?'],['☕','Cafe',1450,1120,'What would you like to eat?'],['📚','Library',350,1100,'What would you like to read?'],['🌊','Lake',900,220,'Who would you like to spend your weekend with?']];const data=JSON.parse(localStorage.getItem('weekendWorld')||'{}');function circle(a,b,r,color){g.beginPath();g.arc(a,b,r,0,7);g.fillStyle=color;g.fill()}function label(t,a,b,z=18){g.font='bold '+z+'px Arial';g.textAlign='center';g.fillStyle='#173c34';g.fillText(t,a,b)}function draw(){const sc=Math.max(.55,Math.min(.9,w/850));g.setTransform(d,0,0,d,0,0);g.fillStyle='#87cc80';g.fillRect(0,0,w,h);g.save();g.scale(sc,sc);g.translate(-x+w/(2*sc),-y+h/(2*sc));g.fillStyle='#d9bd94';g.fillRect(830,0,140,1450);g.fillRect(0,630,1800,140);circle(900,220,155,'#58bed0');for(let i=0;i<90;i++){let a=(i*173)%1800,b=(i*251)%1450;if(Math.abs(a-900)<130||Math.abs(b-700)<120)continue;circle(a,b,24,'#39965b');circle(a-7,b-7,16,'#4eae67')}spots.forEach((s,i)=>{let [ico,n,a,b]=s;if(i!==4){g.fillStyle=['#f2d3a0','#f0d987','#f2ae96','#c6a9dd'][i];g.fillRect(a-65,b-60,130,115);g.fillStyle='#9d6158';g.beginPath();g.moveTo(a-80,b-60);g.lineTo(a,b-120);g.lineTo(a+80,b-60);g.fill()}label(ico+' '+n,a,b+93,22);if(data[n])label('✓',a+72,b+82,24)});circle(x,y+12,17,'#427b6e');circle(x,y,18,'#416cd3');circle(x,y-17,13,'#f1b68d');circle(x,y-28,12,'#5c4434');circle(x,y-17,12,'#f1b68d');if(near)label('TALK / E',near[2],near[3]-140,20);g.restore();document.querySelector('#count').textContent=Object.keys(data).length+' / 5 activities'}function loop(){if(document.querySelector('#box').style.display!=='flex'){let a=dx+(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),b=dy+(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0),len=Math.hypot(a,b);if(len){x=Math.max(25,Math.min(1775,x+a/len*4));y=Math.max(25,Math.min(1425,y+b/len*4))}}near=spots.find(s=>Math.hypot(x-s[2],y-s[3])<165);draw();requestAnimationFrame(loop)}loop();function talk(){if(!near)return;chosen=near;document.querySelector('#place').textContent=near[0]+' '+near[1];document.querySelector('#question').textContent=near[4];document.querySelector('#ans').value=data[near[1]]||'';document.querySelector('#box').style.display='flex'}document.querySelector('#talk').onclick=talk;document.querySelector('#back').onclick=()=>document.querySelector('#box').style.display='none';document.querySelector('#save').onclick=()=>{let v=document.querySelector('#ans').value.trim();if(v.length<8||!v.includes(' ')){alert('Please write a complete sentence in English.');return}data[chosen[1]]=v;localStorage.setItem('weekendWorld',JSON.stringify(data));document.querySelector('#box').style.display='none';if(Object.keys(data).length===5)alert('Great job! My Weekend Story:\n\n'+Object.values(data).join('\n'))};onkeydown=e=>{keys[e.key]=true;if(e.key==='e'||e.key==='E')talk()};onkeyup=e=>keys[e.key]=false;const pad=document.querySelector('#pad'),nub=document.querySelector('#nub');function move(e){let r=pad.getBoundingClientRect(),a=e.clientX-r.left-60,b=e.clientY-r.top-60,m=Math.hypot(a,b);if(m>42){a=a/m*42;b=b/m*42}dx=a/42;dy=b/42;nub.style.transform='translate('+a+'px,'+b+'px)'}pad.onpointerdown=e=>{pad.setPointerCapture(e.pointerId);move(e)};pad.onpointermove=e=>{if(e.buttons)move(e)};pad.onpointerup=pad.onpointercancel=()=>{dx=dy=0;nub.style.transform=''};})();</script></html>
